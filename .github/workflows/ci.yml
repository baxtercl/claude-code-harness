name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]
        include:
          # The guards also run on Windows (Git Bash); Windows paths are tested there.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install pytest ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Validate settings.json
        run: python -m json.tool .claude/settings.json > /dev/null
      - name: Test
        run: pytest -q
