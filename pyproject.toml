[project]
name = "claude-code-harness"
version = "0.1.0"
description = "A tested, defense-in-depth harness for Claude Code: permission tiers, guard hooks, agents, commands and skills."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aldo Saavedra Reyes" }]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM"]

[tool.ruff.lint.per-file-ignores]
".claude/hooks/*.py" = ["I001"]
